name: Theme CI

on:
  push:
    branches: ['**']
    paths:
      - '**'
      - '.github/workflows/theme-ci.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/theme-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:css
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.8.0
      - run: shopify theme check
